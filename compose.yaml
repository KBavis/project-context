services:

  backend:
    image: backend-app
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
    container_name: backend
    env_file:
      - ./apps/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - chromadb
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ANONYMIZED_TELEMETRY=FALSE
    extra_hosts:
      - "host.docker.internal:host-gateway" # linux usage 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ default, shared ]

  frontend:
    image: frontend-app
    build:
      context: ./apps/frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AZURE_MULTI_VENDOR_GATEWAY: ${VITE_AZURE_MULTI_VENDOR_GATEWAY:-false}
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [ default, shared ]

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: chroma_db
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE

  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - ./apps/backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  chroma_data:

networks:
  shared:
    name: shared
