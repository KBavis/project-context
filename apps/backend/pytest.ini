[pytest]

# test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# default pytest flags to inclue verbose output, short traceback, and strict markers
addopts = 
    -v
    --tb=short
    --strict-markers

# pytest markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Tests that are slow to run

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function # ensure each function gets its own event loop
